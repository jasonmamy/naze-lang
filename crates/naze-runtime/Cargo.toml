[package]
name = "naze-runtime"
version.workspace = true
edition.workspace = true

[package.metadata.wasm-pack.profile.release]
wasm-opt = ['-Os']

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
naze-ir = { path = "../naze-ir" }
naze-layout = { path = "../naze-layout" }
naze-renderer = { path = "../naze-renderer" }
wasm-bindgen = "0.2"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "Window",
    "Document",
    "Element",
    "HtmlElement",
    "HtmlInputElement",
    "HtmlTextAreaElement",
    "HtmlCanvasElement",
    "MouseEvent",
    "WheelEvent",
    "KeyboardEvent",
    "Event",
    "EventTarget",
    "CssStyleDeclaration",
    "Location",
    "console",
    "Headers",
    "Request",
    "RequestInit",
    "RequestMode",
    "Response",
    "Navigator",
    "Clipboard",
    "WebSocket",
    "MessageEvent",
    "Storage",
    "Performance",
    "TouchEvent",
    "TouchList",
    "Touch",
    "DomRect",
    "Coordinates",
    "File",
    "FileList",
    "Notification",
    "NotificationOptions",
    "NotificationPermission",
    "Geolocation",
    "Position",
    "PositionError",
    "DeviceMotionEvent",
] }
wasm-bindgen-futures = "0.4"
console_error_panic_hook = "0.1"
