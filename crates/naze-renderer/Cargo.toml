[package]
name = "naze-renderer"
version.workspace = true
edition.workspace = true

[dependencies]
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = [
    "Window",
    "Document",
    "Element",
    "HtmlElement",
    "HtmlCanvasElement",
    "HtmlImageElement",
    "CanvasRenderingContext2d",
    "CssStyleDeclaration",
    "TextMetrics",
] }
js-sys = "0.3"
naze-ir = { path = "../naze-ir" }
