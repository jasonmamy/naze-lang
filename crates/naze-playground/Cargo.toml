[package]
name = "naze-playground"
version.workspace = true
edition.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
naze-parser = { path = "../naze-parser" }
naze-compiler = { path = "../naze-compiler" }
naze-ir = { path = "../naze-ir", features = ["serde"] }
wasm-bindgen = "0.2"
serde_json = "1"
