[package]
name = "nazec"
version.workspace = true
edition.workspace = true

[[bin]]
name = "nazec"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
toml = "0.8"
serde = { workspace = true }
serde_json = { workspace = true }
naze-ir = { path = "../naze-ir", features = ["serde"] }
naze-parser = { path = "../naze-parser" }
naze-compiler = { path = "../naze-compiler" }
naze-layout = { path = "../naze-layout" }
winit = "0.30"
softbuffer = "0.4"
tiny-skia = "0.11"
fontdue = "0.9"
notify = "7"

# Dev server dependencies
axum = { version = "0.7", features = ["ws"] }
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.5", features = ["fs", "set-header"] }
futures = "0.3"
open = "5"
dirs = "5"
